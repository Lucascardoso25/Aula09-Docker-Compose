name: CI Pipeline - Aula 09 Docker Compose

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cenario1-build-test:
    name: Cenário 1 - Build e Teste Ping
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build do Cenário 1
        run: |
          cd cenario1
          docker compose build

      - name: Subir Ambiente do Cenário 1
        run: |
          cd cenario1
          docker compose up -d

      - name: Validar Conectividade Ping
        run: |
          cd cenario1
          docker compose exec -T servico-vizinho ping -c 4 calculadora-app

  cenario2-test:
    name: Cenário 2 - Validar WordPress e MariaDB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Subir Ambiente WordPress
        run: |
          cd cenario2
          docker compose up -d

      - name: Validar Containers Ativos
        run: |
          cd cenario2
          docker compose ps